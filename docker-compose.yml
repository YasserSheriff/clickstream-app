services:
  cassandra:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  app:
    build: .
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_LOCAL_DC: datacenter1
      SIMULATOR_ENABLED: "true"
      SIMULATOR_EVENTS_PER_SECOND: "10"
    ports:
      - "8080:8080"
