# Single-node Cassandra for the demo. For production use a multi-node ring (or an operator such as
# K8ssandra / DataStax Mission Control) or point the app at Astra DB instead.
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  labels: { app: cassandra, app.kubernetes.io/part-of: clickstream }
spec:
  clusterIP: None
  selector: { app: cassandra }
  ports:
    - { name: cql, port: 9042, targetPort: 9042 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  labels: { app: cassandra, app.kubernetes.io/part-of: clickstream }
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"cassandra-openshift:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"cassandra\")].image"}]'
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels: { app: cassandra }
  template:
    metadata:
      labels: { app: cassandra, app.kubernetes.io/part-of: clickstream }
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: cassandra
          image: image-registry.openshift-image-registry.svc:5000/messaging-app/cassandra-openshift:latest
          ports:
            - { name: cql, containerPort: 9042 }
            - { name: intra, containerPort: 7000 }
          env:
            - { name: CASSANDRA_CLUSTER_NAME, value: clickstream }
            - { name: CASSANDRA_DC, value: datacenter1 }
            - { name: CASSANDRA_RACK, value: rack1 }
            - { name: MAX_HEAP_SIZE, value: 512M }
            - { name: HEAP_NEWSIZE, value: 128M }
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          startupProbe:
            tcpSocket: { port: 9042 }
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            tcpSocket: { port: 9042 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 9042 }
            periodSeconds: 20
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "nodetool drain"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/cassandra }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 10Gi }
